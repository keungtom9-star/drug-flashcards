[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/ward"
  to = "/ward.html"
  status = 200

[[redirects]]
  from = "/clinical"
  to = "/drugquiz.html"
  status = 200

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
